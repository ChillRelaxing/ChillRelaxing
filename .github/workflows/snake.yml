name: GitHub Snake Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#FF6B35&color_dots=#FFF5EB,#FFE4CC,#FFCBA4,#FFB88C,#FF9A5E
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFB88C&color_dots=#4A3428,#6B4C3E,#8B6449,#B8845D,#E8A87C
            dist/warm-ocean.gif?color_snake=#FF6B35&color_dots=#FFF5EB,#FFE4CC,#FFCBA4,#FFB88C,#FF9A5E
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"

permissions:
  contents: write
