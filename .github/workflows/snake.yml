name: GitHub Snake Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#444444&color_dots=#f5f5f5,#e0e0e0,#cccccc,#b3b3b3,#999999
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bbbbbb&color_dots=#1f1f1f,#2b2b2b,#383838,#444444,#555555
            dist/minimal.gif?color_snake=#555555&color_dots=#f5f5f5,#e0e0e0,#cccccc,#b3b3b3,#999999
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"

permissions:
  contents: write
